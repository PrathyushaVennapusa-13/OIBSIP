<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Book</title>

<link rel="stylesheet" th:href="@{/css/admin.css}">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>📚 Library</h2>

        <ul>

            <li>
                <a th:href="@{/admin/dashboard}">
                    🏠 Dashboard
                </a>
            </li>

            <li>
                <a th:href="@{/book/all}">
                    📖 View Books
                </a>
            </li>

            <li>
                <a class="active"
                   th:href="@{/book/add}">
                    ➕ Add Book
                </a>
            </li>

            <li>
                <a th:href="@{/admin/users}">
                    👥 Users
                </a>
            </li>

            <li>
                <a th:href="@{/reservation/pending}">
                    📌 Borrow Requests
                </a>
            </li>

            <li>
                <a th:href="@{/borrow/all}">
                    📚 Issued Books
                </a>
            </li>

            <li>
                <a th:href="@{/contact/all}">
                    📩 Contact Messages
                </a>
            </li>

            <li>
                <a th:href="@{/home}">
                    🚪 Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="content">

        <div class="form-card">

            <h1>📚 Add New Book</h1>

            <p>Add a new book to the Digital Library.</p>

            <form
                    th:action="@{/book/add}"
                    th:object="${book}"
                    method="post">

                <div class="form-grid">

                    <div class="form-group">

                        <label>Book Title</label>

                        <input
                                type="text"
                                th:field="*{title}"
                                placeholder="Enter book title"
                                required>

                    </div>

                    <div class="form-group">

                        <label>Author</label>

                        <input
                                type="text"
                                th:field="*{author}"
                                placeholder="Enter author name"
                                required>

                    </div>

                    <div class="form-group">

                        <label>ISBN</label>

                        <input
                                type="text"
                                th:field="*{isbn}"
                                placeholder="Enter ISBN Number"
                                required>

                    </div>

                    <div class="form-group">

                        <label>Category</label>

                        <select th:field="*{category}" required>

                            <option value="">Select Category</option>

                            <option
                                    th:each="cat : ${T(com.lms.util.BookCategory).values()}"
                                    th:value="${cat}"
                                    th:text="${cat}">
                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Total Quantity</label>

                        <input
                                type="number"
                                min="1"
                                th:field="*{totalQuantity}"
                                required>

                    </div>

                    <div class="form-group">

                        <label>Available Quantity</label>

                        <input
                                type="number"
                                min="1"
                                th:field="*{availableQuantity}"
                                required>

                    </div>

                </div>

                <button class="save-btn" type="submit">
                    Save Book
                </button>

            </form>

        </div>

    </main>

</div>

</body>

</html>

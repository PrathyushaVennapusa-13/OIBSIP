<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Books</title>

<link rel="stylesheet" th:href="@{/css/admin.css}">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="dashboard">

<!-- Sidebar -->

<aside class="sidebar">

<h2>📚 Library</h2>

<ul>

<li>
<a th:href="@{/admin/dashboard}">
🏠 Dashboard
</a>
</li>

<li>
<a class="active"
   th:href="@{/book/all}">
📖 Books
</a>
</li>

<li>
<a th:href="@{/book/add}">
➕ Add Book
</a>
</li>

<li>
<a th:href="@{/admin/users}">
👥 Users
</a>
</li>

<li>
<a th:href="@{/reservation/pending}">
📌 Borrow Requests
</a>
</li>

<li>
<a th:href="@{/borrow/all}">
📚 Issued Books
</a>
</li>

<li>
<a th:href="@{/contact/all}">
📩 Contact Messages
</a>
</li>

<li>
<a th:href="@{/home}">
🚪 Logout
</a>
</li>

</ul>

</aside>

<!-- Main Content -->

<main class="content">

<h1>📚 Library Books</h1>

<p>
Manage all books available in the library.
</p>

<!-- Search -->

<div class="search-container">

<form th:action="@{/book/search/title}" method="get">

<input
type="text"
name="title"
placeholder="Search by Title">

<button type="submit">
Search
</button>

</form>

<form th:action="@{/book/search/author}" method="get">

<input
type="text"
name="author"
placeholder="Search by Author">

<button type="submit">
Search
</button>

</form>

<form th:action="@{/book/search/category}" method="get">

<select name="category">

<option value="">
Category
</option>

<option
th:each="cat:${T(com.lms.util.BookCategory).values()}"
th:value="${cat}"
th:text="${cat}">
</option>

</select>

<button type="submit">
Search
</button>

</form>

</div>

<!-- Books Table -->

<table>

<thead>

<tr>

<th>ID</th>

<th>Title</th>

<th>Author</th>

<th>ISBN</th>

<th>Category</th>

<th>Total</th>

<th>Available</th>

<th>Delete</th>

</tr>

</thead>

<tbody>

<tr th:each="book : ${books}">

<td th:text="${book.bookId}"></td>

<td th:text="${book.title}"></td>

<td th:text="${book.author}"></td>

<td th:text="${book.isbn}"></td>

<td th:text="${book.category}"></td>

<td th:text="${book.totalQuantity}"></td>

<td th:text="${book.availableQuantity}"></td>

<td>

<a th:href="@{'/book/delete/' + ${book.bookId}}">

<button class="delete-btn"
type="button">

Delete

</button>

</a>

</td>

</tr>

</tbody>

</table>

</main>

</div>

</body>

</html>

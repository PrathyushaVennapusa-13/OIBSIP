
<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Library</title>

<link rel="stylesheet" th:href="@{/css/user.css}">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>


<body>


<div class="content">


<a th:href="@{/user/dashboard}">
    ⬅ Back to Dashboard
</a>



<div class="form-card">


<h1>📩 Contact Library</h1>


<p>
Have a question or need assistance? Send us a message.
</p>




<form
th:action="@{/contact/send}"
th:object="${contact}"
method="post">



<!-- Automatically gets logged-in user id -->

<input 
type="hidden"
th:field="*{userId}">





<div class="form-group">


<label>Subject</label>


<input
type="text"
th:field="*{subject}"
placeholder="Enter your subject"
required>


</div>






<div class="form-group">


<label>Message</label>


<textarea
th:field="*{message}"
rows="6"
placeholder="Write your message here..."
required></textarea>


</div>






<div>


<button 
type="submit"
class="save-btn">

📩 Send Message

</button>



<button
type="reset"
class="delete-btn">

Clear

</button>


</div>




</form>




</div>



</div>


</body>


</html>
```
